<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>My-Trip-Card</title>
</head>
<body>
    <div class="trip-card">
        <img src="asset/sunset-beach.jpg" alt="Space" />
        <div class="header">
            <h3>Tropical Resort</h3>
            <i 
            class="bi bi-star"
            onclick="toggleFavourite()"
            id="favouriteIcon"
            ></i>
        </div>
        <p>
            Enjoy the sun and the beach in luxury Tropical resort. Enjoy meals,
            activities and relax in this paradise.
        </p>
        <button class="btn-primary">View more</button>
    </div>
</body>
</html>
