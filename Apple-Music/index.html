<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css">
    <title>Player</title>
</head>
<body>
    <div class="player">
        <div class="row-dots">
            <div class="dot"></div>
            <div class="dot orange"></div>
            <div class="dot green"></div>
        </div>
        <div class="sidebar">
            <input placeholder="...search" type="text" id="search" />
            <span class="menu-header">Menu</span>
            <ul>
                <li><i class="bi bi-book"></i>Library</li>
                <li><i class="bi bi-star"></i>Favourite</li>
                <li><i class="bi bi-sliders"></i>Setting</li>
            </ul>
        </div>
        <div class="main">
            <div class="current-song">
                <img src="Assets/photo_2025-07-25_16-15-10.jpg" alt="" />
                <div class="song-info">
                    <span class="song-name">Song Name</span>
                    <span class="artist-name">Artist Name</span>
                    <div class="btn-row">
                        <button class="btn-primary">
                            <i class="bi bi-play-circle-fill">Play</i></button>
                        <button class="btn-primary">
                        <i class="bi bi-shuffle">Shuffle</i></button>
                    </div>
                </div>
            </div>
        <ul class="song-list">
            <li class="song-list-header">
                <span class="song-name-list">Song Name</span>
                <span class="song-name-list">Artist</span>
                <span class="song-name-list">Duration</span>
            </li>
            <li>
                <span class="song-name-list">Top G</span>
                <span class="song-artist-list">Singer</span>
                <span class="song-duration-list">4:45</span>
            </li>
            <li>
                <span class="song-name-list">Top G</span>
                <span class="song-artist-list">Singer</span>
                <span class="song-duration-list">4:45</span>
            </li>
            <li>
                <span class="song-name-list">Top G</span>
                <span class="song-artist-list">Singer</span>
                <span class="song-duration-list">4:45</span>
            </li>
        </ul>
    </div>
    </div>
</body>
</html>
