<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Web Users</title>
        <link 
            rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
        />
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <div class="nav-container">
                <span class="title">Massage</span>
                <i class="bi bi-search"></i>
            </div>
        </nav>
        <div class="switcher">
            <span class="switcher-option switcher-active">Direct Text</span>
            <span class="switcher-option">Video Calls</span>
        </div>
        <ul class="conversations">
            <li class="chat">
                <img src="Assets/Person1.jpg" alt="" class="profile-picture" />
                <div class="chat-info">
                    <span class="chat-name">John</span>
                    <span class="chat-massage">Hello there!</span>
                </div>
            </li>
            <li class="chat">
                <span class="chat-online"></span>
                <img src="Assets/Person2.jpg" alt="" class="profile-picture" />
                <div class="chat-info">
                    <span class="chat-name">Jane</span>
                    <span class="chat-massage">Hey! How are you?</span>
                </div>
            </li>
            <li class="chat">
                <img src="Assets/Person3.jpg" alt="" class="profile-picture">
                <div class="chat-info">
                    <span class="chat-name">Jack F</span>
                    <span class="chat-massage">Hello there!</span>
                </div>
            </li>
        </ul>
    </body>
</html>
